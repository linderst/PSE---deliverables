<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a4f8a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1F5C99;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="pulse" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#7ec8f0;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ffffff;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background rounded square -->
  <rect width="64" height="64" rx="14" ry="14" fill="url(#bg)" />

  <!-- "med" lowercase — upper portion -->
  <text
    x="32"
    y="26"
    font-family="Georgia, 'Times New Roman', serif"
    font-size="24"
    font-weight="700"
    fill="white"
    text-anchor="middle"
    dominant-baseline="middle"
  >med</text>

  <!-- Heartbeat / ECG pulse — centered spike at x=32, symmetrical on both sides -->
  <polyline
    points="4,51  18,51  22,51  26,44  29,58  32,36  35,58  38,44  42,51  60,51"
    fill="none"
    stroke="url(#pulse)"
    stroke-width="2.4"
    stroke-linecap="round"
    stroke-linejoin="round"
    opacity="0.95"
  />
</svg>
