# ╔═══════════════════════════════════════════════════════════════════════════════╗
# ║  docker-compose.yml — PRODUCTION configuration                              ║
# ║                                                                              ║
# ║  For LOCAL DEVELOPMENT: Docker automatically loads                           ║
# ║  docker-compose.override.yml on top of this file, restoring dev ports,       ║
# ║  hot-reload, and source volumes. Just run: docker compose up                 ║
# ║                                                                              ║
# ║  For SERVER DEPLOYMENT: Use only this file:                                  ║
# ║  docker compose -f docker-compose.yml up -d                                  ║
# ╚═══════════════════════════════════════════════════════════════════════════════╝

services:
  # ── PostgreSQL + pgvector ──────────────────────────────────────────────────
  db:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    # No "ports:" here — DB is only accessible within the Docker network.
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./src/backend/database.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ── FastAPI Backend ────────────────────────────────────────────────────────
  backend:
    build:
      context: ./src/backend
      dockerfile: ../../docker/backend/Dockerfile
    restart: unless-stopped
    # No "ports:" here — backend is reached via NGINX reverse proxy.
    environment:
      DB_HOST: db
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      MEILI_URL: http://meilisearch:7700
      MEILI_KEY: ${MEILI_KEY:-masterKey}
      CORS_ORIGINS: https://med.qm1.ch
    depends_on:
      db:
        condition: service_healthy
      meilisearch:
        condition: service_started

  # ── React Frontend (NGINX in production) ───────────────────────────────────
  frontend:
    build:
      context: ./src/frontend
      dockerfile: ../../docker/frontend/Dockerfile
      args:
        VITE_API_BASE_URL: /api
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend

  # ── Meilisearch ────────────────────────────────────────────────────────────
  meilisearch:
    image: getmeili/meilisearch:v1.7
    restart: unless-stopped
    # No "ports:" here — only accessible within Docker network.
    environment:
      MEILI_MASTER_KEY: ${MEILI_KEY:-masterKey}
      MEILI_ENV: production
    volumes:
      - meili_data:/meili_data

  # ── One-off importers (run manually with --profile import) ─────────────────
  importer:
    build:
      context: ./src/backend
      dockerfile: ../../docker/backend/Dockerfile
    command: python import_icd.py
    environment:
      DB_HOST: db
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      DATA_DIR: /app/data
    volumes:
      - ./src/backend:/app
      - ./data:/app/data
      - model_cache:/root/.cache
    depends_on:
      db:
        condition: service_healthy
    profiles:
      - import

  meili-importer:
    build:
      context: ./src/backend
      dockerfile: ../../docker/backend/Dockerfile
    command: python import_meili.py
    environment:
      DB_HOST: db
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      MEILI_URL: http://meilisearch:7700
      MEILI_KEY: ${MEILI_KEY:-masterKey}
    volumes:
      - ./src/backend:/app
    depends_on:
      db:
        condition: service_healthy
      meilisearch:
        condition: service_started
    profiles:
      - import

volumes:
  db_data:
  model_cache:
  meili_data:
