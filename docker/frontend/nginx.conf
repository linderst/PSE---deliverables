# NGINX configuration for the Medcode SPA.
#
# Responsibilities:
#   1. Serve the built React/Vite static files
#   2. Handle SPA client-side routing (try_files → index.html)
#   3. Reverse-proxy /api/* requests to the backend service
#
# This runs INSIDE the frontend container (production only).

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # ── SPA Routing ─────────────────────────────────────────────────────────
    # All non-file requests fall back to index.html so that react-router
    # can handle client-side routes like /:slug/:code
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ── Sitemap Reverse Proxy ───────────────────────────────────────────────
    # The sitemap is dynamically generated by the FastAPI backend
    location = /sitemap.xml {
        proxy_pass http://backend:8000/sitemap.xml;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # ── API Reverse Proxy ───────────────────────────────────────────────────
    # Proxy /api/* to the backend FastAPI service on the Docker network.
    # This means the frontend can use VITE_API_BASE_URL=/api (relative)
    # and everything works without CORS issues.
    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeouts for long-running Gemini API calls
        proxy_read_timeout 120s;
        proxy_connect_timeout 10s;
    }

    # ── Static Asset Caching ────────────────────────────────────────────────
    # Vite uses content-hashed filenames for JS/CSS, so these can be
    # cached aggressively. index.html is never cached (handled above).
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
}
